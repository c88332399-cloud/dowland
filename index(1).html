<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b0a">
  <title>NFT Gift Image</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 28px 16px;
      display: grid; place-items: center;
      background: radial-gradient(ellipse at 50% 0%, #14251c 0%, #090b0a 58%);
      color: #f2f5f3; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app { width: min(100%, 460px); }
    .brand { text-align: center; margin-bottom: 28px; }
    .logo {
      width: 48px; height: 48px; margin: 0 auto 14px; border-radius: 15px;
      display: grid; place-items: center; background: #10291c; color: #43e58b;
      border: 1px solid #24583a; font-size: 23px; font-weight: 800;
    }
    h1 { margin: 0; font-size: 25px; letter-spacing: -.7px; }
    .subtitle { margin: 9px 0 0; color: #89948d; font-size: 14px; line-height: 1.5; }
    .panel {
      background: rgba(17, 21, 19, .96); border: 1px solid #252d28;
      border-radius: 20px; padding: 22px; box-shadow: 0 22px 70px #0008;
    }
    label { display: block; color: #cbd3ce; font-size: 13px; font-weight: 650; margin-bottom: 9px; }
    input {
      width: 100%; height: 49px; padding: 0 14px; border-radius: 11px;
      border: 1px solid #303a33; outline: none; background: #0b0f0c;
      color: #f2f5f3; font-size: 14px;
    }
    input:focus { border-color: #36c879; box-shadow: 0 0 0 3px #36c87920; }
    input::placeholder { color: #68736c; }
    button {
      width: 100%; height: 48px; margin-top: 13px; border: 0; border-radius: 11px;
      background: #27d477; color: #06130b; font-size: 14px; font-weight: 750;
      cursor: pointer; transition: .18s;
    }
    button:hover { background: #42e88d; transform: translateY(-1px); }
    button:disabled { opacity: .55; cursor: wait; transform: none; }
    .status { min-height: 20px; margin: 12px 2px 0; color: #98a39b; font-size: 12px; line-height: 1.5; }
    .result { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #29312c; }
    .preview {
      min-height: 190px; display: grid; place-items: center; overflow: hidden;
      border-radius: 14px; background: #090d0b; border: 1px solid #29332d;
    }
    .preview img { display: block; max-width: 100%; max-height: 360px; object-fit: contain; }
    .download { display: block; text-align: center; text-decoration: none; padding-top: 15px; }
    .hint { color: #68736c; text-align: center; font-size: 11px; margin: 18px 8px 0; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="app">
    <header class="brand">
      <div class="logo">✦</div>
      <h1>NFT Gift Image</h1>
      <p class="subtitle">Вставь ссылку на Telegram NFT-подарок,<br>чтобы получить его изображение.</p>
    </header>

    <section class="panel">
      <form id="giftForm">
        <label for="giftUrl">Ссылка на NFT-подарок</label>
        <input id="giftUrl" type="url" placeholder="https://t.me/nft/ViceCream-313219" required>
        <button id="submitBtn" type="submit">Получить изображение</button>
        <p class="status" id="status" aria-live="polite">Поддерживаются ссылки формата t.me/nft/Название-номер</p>
      </form>

      <div class="result" id="result">
        <div class="preview"><img id="giftImage" alt="Изображение NFT-подарка"></div>
        <a class="download" id="downloadBtn" href="#" download="telegram-nft-gift.png">
          <button type="button">Скачать изображение</button>
        </a>
      </div>
    </section>
    <p class="hint">Изображение загружается с публичной страницы подарка Telegram. Некоторые подарки могут быть недоступны для автоматического получения.</p>
  </main>

  <script>
    const form = document.getElementById('giftForm');
    const input = document.getElementById('giftUrl');
    const button = document.getElementById('submitBtn');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const image = document.getElementById('giftImage');
    const download = document.getElementById('downloadBtn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      let url;
      try { url = new URL(input.value.trim()); }
      catch { status.textContent = 'Введи корректную ссылку.'; return; }

      const match = url.hostname === 't.me' && url.pathname.match(/^\/nft\/([A-Za-z0-9]+-\d{1,9})\/?$/);
      if (!match) {
        status.textContent = 'Нужна ссылка вида https://t.me/nft/Название-номер';
        return;
      }

      button.disabled = true;
      button.textContent = 'Загрузка…';
      status.textContent = 'Ищем изображение подарка…';
      result.style.display = 'none';

      try {
        // Серверный endpoint должен извлечь image URL из публичной страницы Telegram.
        const response = await fetch(`/api/nft?slug=${encodeURIComponent(match[1])}`);
        const data = await response.json();
        if (!response.ok || !data.imageUrl) {
          throw new Error(data.error || 'Не удалось получить изображение. Проверь ссылку или попробуй позже.');
        }

        image.onload = () => {
          result.style.display = 'block';
          status.textContent = 'Изображение готово.';
        };
        image.onerror = () => {
          status.textContent = 'Не удалось открыть изображение. Возможно, источник запретил загрузку.';
          result.style.display = 'none';
        };
        image.src = data.imageUrl;
        download.href = data.imageUrl;
        download.target = '_blank';
        download.rel = 'noopener';
        download.setAttribute('download', `${match[1]}.png`);
      } catch (error) {
        status.textContent = error.message || 'Ошибка загрузки. Попробуй ещё раз.';
      } finally {
        button.disabled = false;
        button.textContent = 'Получить изображение';
      }
    });
  </script>
</body>
</html>
