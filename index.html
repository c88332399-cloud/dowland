<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b0a">
  <title>NFT Gift Image</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,#14251c 0%,#090b0a 58%);color:#f2f5f3;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .app{width:min(100%,460px)}.brand{text-align:center;margin-bottom:28px}.logo{width:48px;height:48px;margin:0 auto 14px;border-radius:15px;display:grid;place-items:center;background:#10291c;color:#43e58b;border:1px solid #24583a;font-size:23px;font-weight:800}
    h1{margin:0;font-size:25px;letter-spacing:-.7px}.subtitle{margin:9px 0 0;color:#89948d;font-size:14px;line-height:1.5}
    .panel{background:rgba(17,21,19,.96);border:1px solid #252d28;border-radius:20px;padding:22px;box-shadow:0 22px 70px #0008}
    label{display:block;color:#cbd3ce;font-size:13px;font-weight:650;margin-bottom:9px}
    input{width:100%;height:49px;padding:0 14px;border-radius:11px;border:1px solid #303a33;outline:none;background:#0b0f0c;color:#f2f5f3;font-size:14px}
    input:focus{border-color:#36c879;box-shadow:0 0 0 3px #36c87920}input::placeholder{color:#68736c}
    button{width:100%;height:48px;margin-top:13px;border:0;border-radius:11px;background:#27d477;color:#06130b;font-size:14px;font-weight:750;cursor:pointer;transition:.18s}
    button:hover{background:#42e88d;transform:translateY(-1px)}button:disabled{opacity:.55;cursor:wait;transform:none}
    .status{min-height:20px;margin:12px 2px 0;color:#98a39b;font-size:12px;line-height:1.5}
    .result{display:none;margin-top:20px;padding-top:20px;border-top:1px solid #29312c}
    .preview{min-height:190px;display:grid;place-items:center;overflow:hidden;border-radius:14px;background:#090d0b;border:1px solid #29332d}
    .preview img{display:block;max-width:100%;max-height:360px;object-fit:contain}
    .hint{color:#68736c;text-align:center;font-size:11px;margin:18px 8px 0;line-height:1.5}
  </style>
</head>
<body>
<main class="app">
  <header class="brand">
    <div class="logo">✦</div><h1>NFT Gift Image</h1>
    <p class="subtitle">Вставь ссылку на Telegram NFT-подарок,<br>чтобы получить и скачать его изображение.</p>
  </header>
  <section class="panel">
    <form id="giftForm">
      <label for="giftUrl">Ссылка на NFT-подарок</label>
      <input id="giftUrl" type="url" placeholder="https://t.me/nft/ViceCream-313219" required>
      <button id="submitBtn" type="submit">Получить изображение</button>
      <p class="status" id="status" aria-live="polite">Формат ссылки: t.me/nft/Название-номер</p>
    </form>
    <div class="result" id="result">
      <div class="preview"><img id="giftImage" alt="Изображение NFT-подарка"></div>
      <button id="downloadBtn" type="button">Скачать изображение</button>
    </div>
  </section>
  <p class="hint">Изображение загружается с публичной страницы Telegram. Доступность зависит от того, предоставляет ли Telegram публичное изображение для этого подарка.</p>
</main>
<script>
const form=document.getElementById('giftForm'),input=document.getElementById('giftUrl'),
submitBtn=document.getElementById('submitBtn'),statusText=document.getElementById('status'),
result=document.getElementById('result'),giftImage=document.getElementById('giftImage'),
downloadBtn=document.getElementById('downloadBtn');
let currentImageUrl='';
form.addEventListener('submit',async e=>{
  e.preventDefault();
  let url;try{url=new URL(input.value.trim())}catch{statusText.textContent='Введи корректную ссылку.';return}
  const match=url.hostname==='t.me'&&url.pathname.match(/^\/nft\/([A-Za-z0-9]+-\d{1,9})\/?$/);
  if(!match){statusText.textContent='Нужна ссылка вида https://t.me/nft/Название-номер';return}
  submitBtn.disabled=true;submitBtn.textContent='Загрузка…';statusText.textContent='Получаем изображение подарка…';result.style.display='none';
  try{
    const response=await fetch(`/api/nft?slug=${encodeURIComponent(match[1])}`);
    const data=await response.json();
    if(!response.ok||!data.imageUrl)throw new Error(data.error||'Не удалось найти изображение для этой ссылки.');
    currentImageUrl=data.imageUrl;
    giftImage.src=`/api/image?url=${encodeURIComponent(currentImageUrl)}`;
    await new Promise((resolve,reject)=>{giftImage.onload=resolve;giftImage.onerror=()=>reject(new Error('Не удалось загрузить изображение.'))});
    result.style.display='block';statusText.textContent='Изображение готово. Теперь его можно скачать.';
  }catch(err){statusText.textContent=err.message||'Ошибка загрузки. Попробуй ещё раз.'}
  finally{submitBtn.disabled=false;submitBtn.textContent='Получить изображение'}
});
downloadBtn.addEventListener('click',async()=>{
  if(!currentImageUrl)return;
  downloadBtn.disabled=true;downloadBtn.textContent='Подготовка…';
  try{
    const response=await fetch(`/api/image?url=${encodeURIComponent(currentImageUrl)}`);
    if(!response.ok)throw new Error('Не удалось скачать файл.');
    const blob=await response.blob(),objectUrl=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=objectUrl;a.download='telegram-nft-gift.jpg';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(objectUrl);
  }catch(err){statusText.textContent=err.message}
  finally{downloadBtn.disabled=false;downloadBtn.textContent='Скачать изображение'}
});
</script>
</body>
</html>
